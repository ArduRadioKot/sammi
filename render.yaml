# Frontend (Vite SPA), FastAPI API, and Postgres.
# Free web services spin down after inactivity. Free Postgres expires after 30 days.
services:
  - type: web
    name: sammi-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sammi-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        fromService:
          name: sammi-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          name: sammi-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: sammi-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: sammi-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_ENABLE_DEMO_DATA
        value: "false"

databases:
  - name: sammi-db
    databaseName: sammi
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
